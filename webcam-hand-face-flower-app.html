    --pink-deep: #ff6f9c;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000;
    font-family: 'Gaegu', sans-serif;
    color:#fff;
    overflow:hidden;
    overscroll-behavior:none;
  }
  #stage{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    transform: scaleX(-1); /* mirror both video + canvas together, keeps landmarks aligned */
    background:#000;
    overflow:hidden;
  }
  video, canvas{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:block;
  }
  video{ object-fit: cover; }
  canvas{ pointer-events:none; }

  .hud{
    position:absolute;
    left:0; right:0;
    top: max(14px, env(safe-area-inset-top));
    padding: 0 14px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    transform: scaleX(-1); /* un-mirror the HUD text so it reads normally */
    pointer-events:none;
  }
  .pill{
    background: rgba(20,15,20,0.45);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 13px;
    color:#fff;
    transition: opacity .25s ease, transform .25s ease, background .25s ease;
  }
  .pill.off{ opacity:0.45; transform: scale(0.95); }
  .pill.on{ opacity:1; background: rgba(255,111,156,0.85); border-color: rgba(255,255,255,0.4); }

  .overlay-panel{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 14px;
    background: radial-gradient(circle at 50% 30%, rgba(50,32,40,0.96), rgba(10,8,10,0.98));
    text-align:center;
    padding: 24px;
    transform: scaleX(-1); /* un-mirror so intro text reads normally */
  }
  .overlay-panel.hidden{ display:none; }
  .flower-emoji{ font-size: 48px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
  h1{
    font-family:'Jua', sans-serif;
    font-size: clamp(22px, 5vw, 30px);
    margin: 0;
    color:#ffb0c9;
    letter-spacing: 1px;
  }
  .btn{
    font-family:'Jua', sans-serif;
    font-size: 17px;
    padding: 13px 30px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #ff9ebb, #ff6f9c);
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(255, 111, 156, 0.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 10px 26px rgba(255, 111, 156, 0.5); }
  .btn:active{ transform: translateY(0px) scale(0.97); }
  .overlay-panel p{ max-width: 420px; line-height:1.7; font-size:14.5px; color:#e6d3da; }
  .overlay-panel .hint{ font-size:13px; color:#b993a6; max-width:340px; }
  .overlay-panel .err{ color:#ff7d94; font-weight:bold; }

  .spinner{
    width: 34px; height:34px;
    border-radius:50%;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #ff9ebb;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .capture-btn{
    position:absolute;
    left:50%; bottom: max(28px, env(safe-area-inset-bottom));
    transform: translateX(-50%) scaleX(-1); /* un-mirror + center */
    width: 68px; height:68px;
    border-radius:50%;
    border: 4px solid rgba(255,255,255,0.85);
    background: radial-gradient(circle at 35% 30%, #ffb0c9, #ff6f9c);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .capture-btn:hover{ box-shadow: 0 8px 22px rgba(0,0,0,0.45); }
  .capture-btn:active{ transform: translateX(-50%) scaleX(-1) scale(0.9); }
  .capture-btn.hidden{ display:none; }
  .capture-btn.flashing{ animation: capturePulse .35s ease; }
  @keyframes capturePulse{ 0%{ box-shadow:0 0 0 0 rgba(255,255,255,0.9);} 100%{ box-shadow:0 0 0 22px rgba(255,255,255,0);} }

  .flash{
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  .flash.on{ opacity:0.85; transition: opacity .05s ease; }
  .flash.fading{ opacity:0; transition: opacity .35s ease; }

  .toast{
    position:absolute;
    left:50%; bottom: max(112px, calc(env(safe-area-inset-bottom) + 112px));
    transform: translateX(-50%) scaleX(-1) translateY(10px);
    background: rgba(20,15,20,0.85);
    color:#fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) scaleX(-1) translateY(0); }

  .preview-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 16px;
    background: rgba(10,8,10,0.92);
    padding: 24px;
    transform: scaleX(-1); /* un-mirror the UI; the captured photo itself is already correctly oriented */
    z-index: 5;
  }
  .preview-overlay.hidden{ display:none; }
  .preview-overlay img{
    max-width: min(90vw, 520px);
    max-height: 58vh;
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
    object-fit: contain;
    background:#000;
  }
  .preview-question{
    color:#fff;
    font-family:'Jua', sans-serif;
    font-size: 16px;
    margin: 0;
  }
  .preview-actions{ display:flex; gap: 14px; }
  .preview-btn{
    font-family:'Jua', sans-serif;
    font-size: 15px;
    padding: 12px 24px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: transform .15s ease;
  }
  .preview-btn:active{ transform: scale(0.96); }
  .preview-btn.secondary{ background: rgba(255,255,255,0.15); color:#fff; border: 1px solid rgba(255,255,255,0.35); }
  .preview-btn.primary{ background: linear-gradient(135deg, #ff9ebb, #ff6f9c); color:#fff; box-shadow: 0 8px 20px rgba(255,111,156,0.4); }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="hud">
    <span class="pill off" id="pillHand">✋ 손 인식 대기중</span>
  </div>

  <div class="flash" id="flash"></div>
  <div class="toast" id="toast">사진이 저장되었어요 🌸</div>
  <button class="capture-btn hidden" id="captureBtn" title="사진 찍기" aria-label="사진 찍기"></button>

  <div class="preview-overlay hidden" id="previewOverlay">
    <img id="previewImg" alt="촬영된 사진" />
    <p class="preview-question">이 사진을 저장하시겠어요?</p>
    <div class="preview-actions">
      <button class="preview-btn secondary" id="retakeBtn">다시 찍기</button>
      <button class="preview-btn primary" id="saveBtn">저장하기</button>
    </div>
  </div>

  <div class="overlay-panel" id="startPanel">
    <div class="flower-emoji">💐</div>
    <h1>감성 플라워캠</h1>
    <p>웹캠으로 손동작을 인식해서<br/>실시간으로 예쁜 꽃 이펙트를 그려주는 앱이에요.</p>
    <p class="hint">☝️ 검지를 움직여 꽃을 그려요 (그린 꽃은 계속 남아요) · ✊→🖐️ 손을 오므렸다 펴면 꽃이 흩날려요 · 📸 마음에 드는 순간엔 사진을 찍어보세요</p>
    <button class="btn" id="startBtn">카메라 시작하기</button>
    <p id="startError" class="err"></p>
  </div>

  <div class="overlay-panel hidden" id="loadingPanel">
    <div class="spinner"></div>
    <p id="loadingText">꽃씨를 심는 중이에요... (AI 모델을 불러오고 있어요)</p>
  </div>
</div>

<script type="module">

/* ---------------------------------------------------------------------- */

/* ---------------------------------------------------------------------- */
/* 1. Flower SVG assets (hand-authored SVG, encoded as data URIs)         */
/* ---------------------------------------------------------------------- */

    { light:'#FFFFFF', dark:'#DCE3F5', center:'#FFEBB8' },
  ],
  leaf:   [ {light:'#BCEB8E', dark:'#5FA052'}, {light:'#CFF5A8', dark:'#4C8C3F'}, {light:'#A9E0C4', dark:'#3E8F6B'} ],
  sparkle:[ {color:'#FFE9A8'}, {color:'#FFFFFF'}, {color:'#FFC1E3'} ],
};

const FLOWER_IMAGES = {}; // type -> [HTMLImageElement, ...]

function svgToImage(svgString){
  const url = 'data:image/svg+xml;base64,' + btoa(svgString);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(img); // resolve anyway to avoid hanging the app
    img.src = url;
  });
}

async function preloadFlowerImages(){
  const jobs = [];
  for (const type of Object.keys(SVG_TEMPLATES)){
    FLOWER_IMAGES[type] = [];
    COLOR_VARIANTS[type].forEach((variant, i) => {
      const svg = SVG_TEMPLATES[type](variant);
      jobs.push(svgToImage(svg).then(img => { FLOWER_IMAGES[type][i] = img; }));
    });
  }
  await Promise.all(jobs);
}

function randomFlowerImage(type){
  const arr = FLOWER_IMAGES[type];
  return arr[(Math.random() * arr.length) | 0];
}

/* ---------------------------------------------------------------------- */
/* 2. Particle system (trail flowers / leaves / sparkles)                 */
/* ---------------------------------------------------------------------- */
const TRAIL_TYPES = ['daisy', 'rose', 'sakura', 'bloom', 'leaf', 'leaf', 'sparkle', 'sparkle'];

class Particle{
  constructor(x, y, type){
    this.x = x; this.y = y;
    this.type = type;
    this.img = randomFlowerImage(type);
    this.baseSize = 26 + Math.random() * 30; // random size
    this.rotation = (Math.random() - 0.5) * Math.PI; // random tilt
    this.rotSpeed = (Math.random() - 0.5) * 0.6;
    this.baseAlpha = 0.82 + Math.random() * 0.18; // slight opacity variance
    this.scale = 0;
    this.targetScale = 1;
    this.age = 0;
    this.growDuration = 0.2; // 0.2s pop-in
    // No natural lifespan: planted flowers stay on screen indefinitely and
    // only ever leave via the open-hand scatter gesture.
    this.mode = 'grow'; // grow -> alive -> scatter -> dead
    this.alpha = 0;
    this.vx = 0; this.vy = 0;
    this.dead = false;
    this.baked = false; // true once painted into the static layer
  }
  scatter(){
    if (this.mode === 'scatter') return;
    this.mode = 'scatter';
    // Gentle, dreamy drift rather than an explosive burst: slow outward
    // speed, a slight upward bias so petals seem to lift and float away,
    // and a long slow fade.
    const angle = Math.random() * Math.PI * 2;
    const speed = 30 + Math.random() * 70;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - (25 + Math.random() * 45);
    this.rotSpeed = (Math.random() - 0.5) * 1.6;
    this.swayPhase = Math.random() * Math.PI * 2;
    this.swaySpeed = 0.8 + Math.random() * 1.2;
    this.swayAmp = 12 + Math.random() * 26;
    this.scatterAge = 0;
    this.scatterDelay = Math.random() * 0.55;      // staggered so the sweep ripples across the screen
    this.scatterLife = 2.4 + Math.random() * 1.6;  // slow ~2.4-4s fade out
  }
  update(dt){
    this.age += dt;
    if (this.mode === 'grow'){
      const t = Math.min(1, this.age / this.growDuration);
      const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic pop
      this.scale = eased * this.targetScale;
      this.alpha = eased * this.baseAlpha;
      this.rotation += this.rotSpeed * dt;
      if (t >= 1) this.mode = 'alive';
    } else if (this.mode === 'alive'){
      // Settled: holds its pose exactly, which is what lets it be baked into
      // the static layer and skipped on subsequent frames.
      this.scale = this.targetScale;
      this.alpha = this.baseAlpha;
    } else if (this.mode === 'scatter'){
      this.scatterAge += dt;
      if (this.scatterAge < this.scatterDelay) return; // not swept up yet
      const st = this.scatterAge - this.scatterDelay;
      this.vy += 26 * dt;             // very light gravity - petals hang in the air
      this.vx *= (1 - 0.35 * dt);
      this.vy *= (1 - 0.25 * dt);
      this.x += (this.vx + Math.sin(st * this.swaySpeed + this.swayPhase) * this.swayAmp) * dt;
      this.y += this.vy * dt;
      this.rotation += this.rotSpeed * dt;
      const t = Math.min(1, st / this.scatterLife);
      this.alpha = this.baseAlpha * Math.pow(1 - t, 1.6); // soft, lingering falloff
      this.scale = this.targetScale * (1 + 0.12 * t);
      if (t >= 1) this.dead = true;
    }
  }
  draw(ctx){
    if (!this.img || !this.img.complete) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    // no shadowBlur here on purpose: it's a canvas-wide expensive effect and
    // with up to MAX_PARTICLES flowers on screen it was the main source of
    // frame stutter. Crown flowers (few, mostly static) still get one.
    const s = this.baseSize * this.scale;
    ctx.drawImage(this.img, -s / 2, -s / 2, s, s);
    ctx.restore();
  }
}

let particles = [];
// Flowers accumulate instead of expiring, so this cap is what actually
// bounds the scene. Oldest ones drop off once it's reached.
const MAX_PARTICLES = 600;

// Once a flower has finished popping in it never moves again until it's
// scattered, so redrawing hundreds of them every frame is pure waste. They
// get painted once into this offscreen layer, which is then blitted as a
// single image per frame - what keeps the accumulating bouquet cheap.
const bakedCanvas = document.createElement('canvas');
const bakedCtx = bakedCanvas.getContext('2d');
let rebakeNeeded = false;

function resizeBakedLayer(){
  bakedCanvas.width = canvas.width;
  bakedCanvas.height = canvas.height;
  bakedCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rebakeNeeded = true; // canvas resize wipes its contents
}

function clearBakedLayer(){
  bakedCtx.save();
  bakedCtx.setTransform(1, 0, 0, 1, 0, 0);
  bakedCtx.clearRect(0, 0, bakedCanvas.width, bakedCanvas.height);
  bakedCtx.restore();
}

function rebakeAll(){
  clearBakedLayer();
  particles.forEach(p => {
    if (p.mode === 'alive'){ p.draw(bakedCtx); p.baked = true; }
    else p.baked = false;
  });
  rebakeNeeded = false;
}

function spawnParticle(x, y){
  if (particles.length >= MAX_PARTICLES){
    // The dropped flower's pixels are still sitting in the baked layer, so
    // the layer has to be rebuilt without it.
    const gone = particles.shift();
    if (gone.baked) rebakeNeeded = true;
  }
  const type = TRAIL_TYPES[(Math.random() * TRAIL_TYPES.length) | 0];
  const jitterX = (Math.random() - 0.5) * 14;
  const jitterY = (Math.random() - 0.5) * 14;
  particles.push(new Particle(x + jitterX, y + jitterY, type));
}

function scatterAllParticles(){
  // Everything starts moving again, so nothing can stay baked.
  clearBakedLayer();
  rebakeNeeded = false;
  particles.forEach(p => { p.baked = false; p.scatter(); });
}

/* ---------------------------------------------------------------------- */
/* 3. Hand gesture helpers                                                */
/* ---------------------------------------------------------------------- */
const handState = {}; // per-hand-slot open/closed + recent fingertip trail

function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

// Uniform Catmull-Rom: passes through p1 and p2, using p0/p3 as the
// tangent-shaping neighbors, so a spline through several tracked points
// curves naturally instead of the path looking like straight segments.
function catmullRomPoint(p0, p1, p2, p3, t){
  const t2 = t * t, t3 = t2 * t;
  return {
    x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
    y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
  };
}

const SPAWN_GAP = 11;       // spacing between flowers along the drawn stroke
const MOVE_THRESHOLD = 7;   // px the fingertip must travel before a new flower is planted
const TIP_SMOOTHING = 0.45; // EMA factor - tames landmark jitter so strokes read as smooth curves

// Spawns flowers along a smooth curve from the hand's recent trail to the
// new point (x, y), rather than only at the new point - keeps the trail
// visually continuous through fast swipes and gives it a natural curve
// instead of a straight connect-the-dots line. Returns true when the finger
// actually moved enough to plant something.
function spawnAlongTrail(st, rawX, rawY){
  // Smooth the tracked fingertip before drawing with it. Raw landmarks
  // jitter a pixel or two every frame even for a perfectly still hand,
  // which would otherwise dribble flowers out of a motionless finger.
  if (st.smoothTip){
    st.smoothTip.x += (rawX - st.smoothTip.x) * TIP_SMOOTHING;
    st.smoothTip.y += (rawY - st.smoothTip.y) * TIP_SMOOTHING;
  } else {
    st.smoothTip = { x: rawX, y: rawY };
  }
  const x = st.smoothTip.x, y = st.smoothTip.y;

  if (!st.trail.length){
    st.trail = [{ x, y }];
    return false; // don't plant on the first frame - wait for real movement
  }
  const last = st.trail[st.trail.length - 1];
  const segDist = dist(last, { x, y });
  if (segDist < MOVE_THRESHOLD) return false; // finger is essentially still

  st.trail.push({ x, y });
  if (st.trail.length > 3) st.trail.shift();

  const p2 = { x, y };
  const p1 = last;
  const p0 = st.trail.length >= 3 ? st.trail[st.trail.length - 3] : p1;
  const p3 = { x: p2.x + (p2.x - p1.x), y: p2.y + (p2.y - p1.y) }; // look-ahead extrapolation

  const steps = Math.max(1, Math.min(28, Math.round(segDist / SPAWN_GAP)));
  for (let i = 1; i <= steps; i++){
    const pt = catmullRomPoint(p0, p1, p2, p3, i / steps);
    spawnParticle(pt.x, pt.y);
  }
  return true;
}

const FINGER_TIPS = [8, 12, 16, 20];
const FINGER_PIPS = [6, 10, 14, 18];

// A finger counts as extended when its tip sits meaningfully further from
// the wrist than its middle joint does - scale-free, so it works the same
// whether the hand is near or far from the camera.
function extendedFingers(lm){
  const wrist = lm[0];
  const flags = [];
  for (let i = 0; i < 4; i++){
    flags.push(dist(wrist, lm[FINGER_TIPS[i]]) > dist(wrist, lm[FINGER_PIPS[i]]) * 1.12);
  }
  return flags;
}

function isHandOpen(lm){
  const handScale = dist(lm[0], lm[9]) || 0.001;
  const flags = extendedFingers(lm);
  const spread = dist(lm[8], lm[20]) / handScale;
  return flags.every(Boolean) && spread > 1.5;
}

// Fist / closed hand: every finger curled in. This is the first half of the
// "close, then open" gesture that sweeps the screen.
function isHandClosed(lm){
  const wrist = lm[0];
  const handScale = dist(wrist, lm[9]) || 0.001;
  let curled = 0;
  for (let i = 0; i < 4; i++){
    if (dist(wrist, lm[FINGER_TIPS[i]]) < dist(wrist, lm[FINGER_PIPS[i]]) * 1.05) curled++;
  }
  const spread = dist(lm[8], lm[20]) / handScale;
  return curled >= 3 && spread < 1.3;
}

// Pointing: index finger out, the other three tucked away. Flowers are only
// planted in this pose, so a hand that's simply moving through frame (or an
// open palm being waved) doesn't smear flowers everywhere.
function isPointing(lm){
  const [index, middle, ring, pinky] = extendedFingers(lm);
  return index && !middle && !ring && !pinky;
}

/* ---------------------------------------------------------------------- */
/* 4. Hand tracking overlay (visible proof the hand is being read)        */
/* ---------------------------------------------------------------------- */
// Standard MediaPipe hand topology: bone segments between the 21 landmarks.
const HAND_BONES = [
  [0,1],[1,2],[2,3],[3,4],          // thumb
  [0,5],[5,6],[6,7],[7,8],          // index
  [5,9],[9,10],[10,11],[11,12],     // middle
  [9,13],[13,14],[14,15],[15,16],   // ring
  [13,17],[17,18],[18,19],[19,20],  // pinky
  [0,17],                           // palm base
];
const PALM_HULL = [0, 1, 5, 9, 13, 17]; // filled to give the hand a soft body

function drawHandOverlay(ctx, lm, mode){
  const pts = lm.map(p => toScreen(p.x, p.y));
  // Scale the overlay's line weights to the hand's on-screen size so it
  // looks the same whether the user is close to or far from the camera.
  const handScale = dist(pts[0], pts[9]) || 1;
  const boneW = Math.max(1, handScale * 0.045);
  const jointR = Math.max(1.2, handScale * 0.03);

  // Pointing hands glow warmer/brighter to signal "this is the one drawing".
  const tint = mode === 'point' ? '255,150,185' : '255,190,205';
  const bodyAlpha = mode === 'point' ? 0.22 : 0.14;

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  PALM_HULL.forEach((i, k) => { k ? ctx.lineTo(pts[i].x, pts[i].y) : ctx.moveTo(pts[i].x, pts[i].y); });
  ctx.closePath();
  ctx.fillStyle = `rgba(${tint},${bodyAlpha})`;
  ctx.fill();

  ctx.strokeStyle = `rgba(${tint},0.55)`;
  ctx.lineWidth = boneW * 1.7;
  ctx.beginPath();
  HAND_BONES.forEach(([a, b]) => {
    ctx.moveTo(pts[a].x, pts[a].y);
    ctx.lineTo(pts[b].x, pts[b].y);
  });
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = Math.max(0.75, boneW * 0.5);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  pts.forEach((p, i) => {
    const r = (i === 8 && mode === 'point') ? jointR * 1.8 : jointR;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Halo on the index tip while pointing - shows exactly where flowers land.
  if (mode === 'point'){
    const tip = pts[8];
    const glow = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, jointR * 6);
    glow.addColorStop(0, 'rgba(255,255,255,0.55)');
    glow.addColorStop(1, 'rgba(255,150,185,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, jointR * 6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ---------------------------------------------------------------------- */
/* 5. MediaPipe setup                                                     */
/* ---------------------------------------------------------------------- */
let handLandmarker = null;

async function createLandmarkers(){
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );

  async function tryCreate(factory, modelUrl, extra){
    try{
      return await factory.createFromOptions(vision, {
        baseOptions: { modelAssetPath: modelUrl, delegate: 'GPU' },
        runningMode: 'VIDEO',
        ...extra,
      });
    } catch (e){
      return await factory.createFromOptions(vision, {
        baseOptions: { modelAssetPath: modelUrl, delegate: 'CPU' },
        runningMode: 'VIDEO',
        ...extra,
      });
    }
  }

  // Face tracking (and the flower crown it powered) was removed, so hand
  // tracking is now the only model running - it gets detected every single
  // frame instead of sharing time with a second model, which is a big part
  // of keeping things responsive even at higher camera resolutions.
  handLandmarker = await tryCreate(
    HandLandmarker,
    'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
    { numHands: 2 }
  );
}

/* ---------------------------------------------------------------------- */
/* 6. Camera setup                                                        */
/* ---------------------------------------------------------------------- */
// The video fills the fullscreen stage with object-fit:cover (crops to fill,
// no distortion). MediaPipe landmarks are normalized to the *source* video
// frame though, so we track the cover crop's scale/offset to map them onto
// screen pixels correctly.
let videoW = 0, videoH = 0;
let coverScale = 1, coverOffsetX = 0, coverOffsetY = 0;
let dpr = window.devicePixelRatio || 1;

// The camera can capture at up to 4K for a sharp, full-screen picture, but
// feeding a 4K frame straight into the hand-tracking model every frame is
// what actually causes stutter (the model's own internal resize of a huge
// source image isn't free). So detection always runs against a small
// downsampled copy of the frame instead - display quality and tracking
// speed are decoupled, and detection stays fast no matter the camera res.
const DETECT_MAX_DIM = 320;
const detectCanvas = document.createElement('canvas');
const detectCtx = detectCanvas.getContext('2d', { willReadFrequently: false });

function updateCoverTransform(){
  if (!videoW || !videoH) return;
  const rect = stage.getBoundingClientRect();
  coverScale = Math.max(rect.width / videoW, rect.height / videoH);
  coverOffsetX = (videoW * coverScale - rect.width) / 2;
  coverOffsetY = (videoH * coverScale - rect.height) / 2;
}

function resizeCanvasToStage(){
  const rect = stage.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  resizeBakedLayer();
  updateCoverTransform();
}

// Maps a normalized (0-1) landmark coordinate (relative to the source video
// frame) to on-screen canvas pixel coordinates under the cover crop.
function toScreen(nx, ny){
  return {
    x: nx * videoW * coverScale - coverOffsetX,
    y: ny * videoH * coverScale - coverOffsetY,
  };
}

window.addEventListener('resize', () => { if (running) resizeCanvasToStage(); });
document.addEventListener('fullscreenchange', () => { if (running) resizeCanvasToStage(); });

async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 3840 }, height: { ideal: 2160 }, facingMode: 'user' },
    audio: false,
  });
  video.srcObject = stream;
  await new Promise(resolve => {
    video.onloadedmetadata = () => resolve();
  });
  await video.play();

  videoW = video.videoWidth;
  videoH = video.videoHeight;
  const detectScale = Math.min(1, DETECT_MAX_DIM / Math.max(videoW, videoH));
  detectCanvas.width = Math.max(1, Math.round(videoW * detectScale));
  detectCanvas.height = Math.max(1, Math.round(videoH * detectScale));
  resizeCanvasToStage();
}

/* ---------------------------------------------------------------------- */
/* 7. Main loop                                                           */
/* ---------------------------------------------------------------------- */
let lastVideoTime = -1;
let lastFrameTs = performance.now();
let running = false;

function setPill(el, active, text){
  el.textContent = text;
  el.classList.toggle('on', active);
  el.classList.toggle('off', !active);
}

// Detection runs in its own loop, completely decoupled from rendering, and
// writes into this shared cache - the rAF render loop below never calls
// into MediaPipe directly, so a slow detection pass can never stall a
// video/particle frame. createImageBitmap's video/image resize runs off the
// main thread in modern browsers (unlike a synchronous canvas drawImage),
// which matters a lot at 4K: copying a full-res frame down to a small
// detection size is the expensive part, not the model inference itself.
let latestHandLandmarks = [];
let detecting = false;
let detectIntervalMs = 0;
let scatterFlashUntil = 0; // keeps the "흩날려요" status up briefly after a scatter fires

async function detectTick(){
  if (!running) return;
  if (!detecting && video.currentTime !== lastVideoTime){
    detecting = true;
    lastVideoTime = video.currentTime;
    const t0 = performance.now();
    try{
      let result;
      if (window.createImageBitmap){
        const bmp = await createImageBitmap(video, { resizeWidth: detectCanvas.width, resizeHeight: detectCanvas.height, resizeQuality: 'low' });
        result = handLandmarker.detectForVideo(bmp, performance.now());
        bmp.close();
      } else {
        detectCtx.drawImage(video, 0, 0, detectCanvas.width, detectCanvas.height);
        result = handLandmarker.detectForVideo(detectCanvas, performance.now());
      }
      latestHandLandmarks = result.landmarks || [];
    } catch(e){ /* transient decode hiccup - just retry next tick */ }
    // Adapt the next gap so detection never eats more than ~40% of the
    // frame budget: fast (GPU) devices stay near max-rate, slow ones back off.
    detectIntervalMs = Math.max(0, Math.min(200, (performance.now() - t0) / 0.4));
    detecting = false;
  }
  setTimeout(detectTick, detectIntervalMs);
}

function loop(nowMs){
  if (!running) return;
  requestAnimationFrame(loop);

  const dt = Math.min(0.05, (nowMs - lastFrameTs) / 1000);
  lastFrameTs = nowMs;

  const cw = canvas.width / dpr, ch = canvas.height / dpr;
  if (cw === 0 || ch === 0) return;

  // --- hands: pointing plants flowers, close-then-open scatters them ---
  const overlays = [];
  {
    const hands = latestHandLandmarks;
    const seenSlots = new Set();
    let statusText = '✋ 손 인식 대기중';
    let drawingNow = false;

    hands.forEach((lm, idx) => {
      seenSlots.add(idx);
      if (!handState[idx]) handState[idx] = { armed: false, trail: [], smoothTip: null, cooldown: 0, lastSeen: nowMs };
      const st = handState[idx];
      st.cooldown = Math.max(0, st.cooldown - dt);
      st.lastSeen = nowMs;

      const open = isHandOpen(lm);
      const closed = isHandClosed(lm);
      const pointing = isPointing(lm);

      // "Close, then open" - curling up arms the gesture, opening fires it.
      // Requiring both halves means a hand that merely enters frame already
      // open can't accidentally wipe the screen.
      if (closed) st.armed = true;
      if (open && st.armed && st.cooldown <= 0){
        scatterAllParticles();
        st.armed = false;
        st.cooldown = 0.8;
        scatterFlashUntil = nowMs + 1600;
      }

      let mode = 'idle';
      if (pointing){
        mode = 'point';
        const tip = lm[8];
        const { x, y } = toScreen(tip.x, tip.y);
        if (spawnAlongTrail(st, x, y)) drawingNow = true;
      } else if (open || closed){
        // A confident switch to a different gesture - safe to end the stroke.
        mode = open ? 'open' : 'closed';
        st.trail = [];
        st.smoothTip = null;
      } else {
        // Ambiguous frame (finger-curl classification flickers a lot near
        // the bottom of frame / close to the body, where the wrist can be
        // partly out of view). Don't cut the stroke - just pause a beat so
        // it can pick back up from the same spot instead of restarting.
        mode = 'idle';
      }
      overlays.push({ lm, mode });

      if (idx === 0){
        if (nowMs < scatterFlashUntil) statusText = '🌬️ 꽃이 흩날려요';
        else if (mode === 'point') statusText = drawingNow ? '🌸 꽃을 그리는 중' : '☝️ 검지를 움직여 그려보세요';
        else if (mode === 'open') statusText = '🖐️ 오므렸다 펴면 흩날려요';
        else if (mode === 'closed') statusText = '✊ 이제 손을 펴보세요';
        else statusText = '✋ 손 인식중';
      }
    });

    setPill(pillHand, hands.length > 0, statusText);
    // Give a briefly-lost hand (tracking dropout, not the user actually
    // pulling their hand away) a grace window before wiping its stroke -
    // this is what "flowers don't draw well" near the frame edge usually
    // turns out to be: a few dropped detections snapping the trail back
    // to square one instead of continuing where it left off.
    Object.keys(handState).forEach(key => {
      if (seenSlots.has(Number(key))) return;
      const st = handState[key];
      if (nowMs - st.lastSeen > 350) delete handState[key];
    });
  }

  // --- update + render ---
  particles.forEach(p => p.update(dt));
  if (particles.some(p => p.dead)) particles = particles.filter(p => !p.dead);

  // Flowers that have just finished settling get retired into the static
  // layer, so from here on they cost one shared blit instead of one draw
  // call each.
  if (rebakeNeeded){
    rebakeAll();
  } else {
    particles.forEach(p => {
      if (!p.baked && p.mode === 'alive'){ p.draw(bakedCtx); p.baked = true; }
    });
  }

  ctx.clearRect(0, 0, cw, ch);
  ctx.drawImage(bakedCanvas, 0, 0, cw, ch);
  particles.forEach(p => { if (!p.baked) p.draw(ctx); });
  overlays.forEach(o => drawHandOverlay(ctx, o.lm, o.mode));
}

/* ---------------------------------------------------------------------- */
/* 8. Boot sequence                                                       */
/* ---------------------------------------------------------------------- */
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startError.textContent = '';
  startPanel.classList.add('hidden');
  loadingPanel.classList.remove('hidden');

  // Best-effort native fullscreen; the layout is already fullscreen via CSS
  // regardless, so a rejection here (sandboxed iframe, user setting, etc.)
  // is safe to ignore.
  try{ await document.documentElement.requestFullscreen(); } catch(e){}

  try{
    loadingText.textContent = '카메라를 켜는 중이에요...';
    await startCamera();

    loadingText.textContent = '꽃씨를 심는 중이에요... (AI 모델을 불러오고 있어요)';
    await Promise.all([ preloadFlowerImages(), createLandmarkers() ]);

    loadingPanel.classList.add('hidden');
    captureBtn.classList.remove('hidden');
    running = true;
    lastFrameTs = performance.now();
    requestAnimationFrame(loop);
    detectTick();
  } catch (err){
    console.error(err);
    loadingPanel.classList.add('hidden');
    startPanel.classList.remove('hidden');
    startBtn.disabled = false;
    startError.textContent = '카메라 또는 AI 모델을 불러오지 못했어요. 카메라 권한을 확인하고 다시 시도해주세요.';
  }
});

/* ---------------------------------------------------------------------- */
/* 9. Photo capture                                                       */
/* ---------------------------------------------------------------------- */
let toastTimer = null;

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

let pendingPhotoDataUrl = null;

// Composites the current video frame + flowers exactly as shown on screen
// (mirrored, cover-cropped) into a PNG, then shows a review overlay instead
// of saving right away - the user gets a moment to look at the shot before
// deciding to keep it. The flowers are re-drawn here rather than copied off
// the live canvas so the hand-tracking overlay, which is a UI affordance
// rather than part of the picture, stays out of the saved photo.
function capturePhoto(){
  if (!running) return;
  const w = canvas.width, h = canvas.height;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const octx = out.getContext('2d');

  octx.save();
  octx.translate(w, 0);
  octx.scale(-1, 1); // mirror to match what's visually on screen
  const drawW = videoW * coverScale * dpr;
  const drawH = videoH * coverScale * dpr;
  const dx = -coverOffsetX * dpr;
  const dy = -coverOffsetY * dpr;
  octx.drawImage(video, dx, dy, drawW, drawH);
  octx.scale(dpr, dpr); // particles live in CSS-pixel space
  particles.forEach(p => p.draw(octx));
  octx.restore();

  captureBtn.classList.remove('flashing');
  void captureBtn.offsetWidth; // restart the pulse animation
  captureBtn.classList.add('flashing');
  flashEl.classList.remove('fading');
  flashEl.classList.add('on');
  requestAnimationFrame(() => {
    flashEl.classList.remove('on');
    flashEl.classList.add('fading');
  });

  pendingPhotoDataUrl = out.toDataURL('image/png');
  previewImg.src = pendingPhotoDataUrl;
  previewOverlay.classList.remove('hidden');
}

// On phones/tablets, a web page can't write into the OS Photo Gallery on
// its own - there's no such permission for websites. The standard bridge
// browsers provide is the Web Share API's file sharing: it opens the native
// share sheet, and the user picks "Save Image"/"이미지 저장" from there,
// which does save it into the device's gallery app. On desktop (or if that
// API isn't available) it falls back to a normal file download instead.
async function savePendingPhoto(){
  if (!pendingPhotoDataUrl) return;
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  const filename = `flowercam_${stamp}.png`;

  if (navigator.share && navigator.canShare){
    try{
      const blob = await (await fetch(pendingPhotoDataUrl)).blob();
      const file = new File([blob], filename, { type: 'image/png' });
      if (navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: '감성 플라워캠' });
        showToast('사진을 저장했어요 🌸');
        return;
      }
    } catch (e){
      if (e && e.name === 'AbortError') return; // user cancelled the share sheet - don't also force a download
      // otherwise fall through to the plain download below
    }
  }

  const link = document.createElement('a');
  link.download = filename;
  link.href = pendingPhotoDataUrl;
  document.body.appendChild(link);
  link.click();
  link.remove();
  showToast('사진이 저장되었어요 🌸');
}

function closePreview(){
  previewOverlay.classList.add('hidden');
  pendingPhotoDataUrl = null;
  previewImg.src = '';
}

captureBtn.addEventListener('click', capturePhoto);
retakeBtn.addEventListener('click', closePreview);
saveBtn.addEventListener('click', async () => {
  await savePendingPhoto();
  closePreview();
});
</script>
