<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none';" />
<title>RabbitAI 토끼비서</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="widget">
    <div class="titlebar">
      <div class="brand">
        <img src="../../assets/icon-32.png" alt="rabbit" class="brand-icon" />
        <span>RabbitAI</span>
      </div>
      <div class="titlebar-btns">
        <button id="btn-voice" class="icon-btn" title="음성 켜기/끄기">🔊</button>
        <button id="btn-settings" class="icon-btn" title="설정">⚙️</button>
        <button id="btn-minimize" class="icon-btn" title="숨기기">─</button>
        <button id="btn-quit" class="icon-btn danger" title="종료">✕</button>
      </div>
    </div>

    <div class="rabbit-stage">
      <div class="glow-ring"></div>
      <img src="../../assets/icon-256.png" class="rabbit-avatar" id="rabbit-avatar" alt="토끼" />
    </div>

    <div class="info-bar" id="info-bar">
      <span id="info-text">위치/날씨 불러오는 중...</span>
      <button id="btn-refresh-info" class="mini-btn" title="새로고침">↻</button>
    </div>

    <div class="chat-log" id="chat-log">
      <div class="msg bot">
        안녕하세요! 저는 래빗이예요 🐰 궁금한 걸 물어보시면 최신 정보를 확인해서 알려드릴게요.
      </div>
    </div>

    <form class="composer" id="composer">
      <input
        id="question-input"
        type="text"
        placeholder="무엇이든 물어보세요..."
        autocomplete="off"
      />
      <button type="submit" class="send-btn" title="질문하기">➤</button>
    </form>
  </div>

  <!-- 설정 패널 -->
  <div class="settings-overlay hidden" id="settings-overlay">
    <div class="settings-panel">
      <h3>설정</h3>
      <label class="field-label">Gemini API 키</label>
      <input id="api-key-input" type="password" placeholder="AIza..." />
      <p class="hint">
        Google AI Studio에서 무료로 발급받은 Gemini API 키를 입력하세요.
        키는 이 PC에만 안전하게 저장됩니다.
      </p>
      <div class="settings-actions">
        <button id="btn-save-settings" class="primary-btn">저장</button>
        <button id="btn-close-settings" class="ghost-btn">닫기</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
